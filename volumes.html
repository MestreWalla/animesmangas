<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Volumes</title>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="back-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-left"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <h1 id="manga-title"></h1>
            <div class="controls">
                <div class="filter-options">
                    <button class="filter-button active" data-filter="all">Todos</button>
                    <button class="filter-button" data-filter="Adquirido">Adquiridos</button>
                    <button class="filter-button" data-filter="Falta">Faltantes</button>
                </div>
                <button id="theme-toggle" class="theme-button">
                    <span class="theme-icon"></span>
                </button>
            </div>
        </div>
    </header>
    <main>
        <div class="synopsis-container">
            <h2>Sinopse</h2>
            <p id="manga-synopsis"></p>
        </div>
        <div class="card-grid" id="volumes-container">
            <!-- Volume cards will be dynamically added here by JavaScript -->
        </div>
    </main>
    <script defer type="module" src="volumes.js"></script>
    <script defer src="theme.js"></script>
</body>
</html>
