<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Carregando...</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">

    <div class="wallpaper-bg" id="manga-wallpaper-bg"></div>

    <header class="manga-header">
        <div class="header-content">
            <a href="index.html" class="back-button" aria-label="Voltar para a coleção">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18L9 12l6-6"/></svg>
            </a>
            <h1 id="header-manga-title" class="header-manga-title">Carregando...</h1>
            <button class="theme-switcher-grid" id="theme-switcher" aria-label="Switch theme">
                <div class="sun" aria-hidden="true"></div>
                <div class="moon-overlay" aria-hidden="true"></div>
                <div class="cloud-ball cloud-ball-left" aria-hidden="true"></div>
                <div class="cloud-ball cloud-ball-middle" aria-hidden="true"></div>
                <div class="cloud-ball cloud-ball-right" aria-hidden="true"></div>
                <div class="cloud-ball cloud-ball-top" aria-hidden="true"></div>
                <div class="star" id="star1" aria-hidden="true"></div>
                <div class="star" id="star2" aria-hidden="true"></div>
                <div class="star" id="star3" aria-hidden="true"></div>
                <div class="star" id="star4" aria-hidden="true"></div>
            </button>
        </div>
    </header>

    <main class="manga-detail-main">
        <div class="manga-detail-container">
            <!-- Coluna da Esquerda: Informações do Mangá -->
            <aside class="manga-detail-sidebar">
                <div class="sidebar-content">
                    <img id="manga-cover-image" src="" alt="Capa do Mangá" class="manga-cover-image">
                    <div class="manga-info">
                        <h1 id="manga-title">Carregando...</h1>
                        <p id="manga-synopsis">Carregando...</p>
                    </div>
                </div>
            </aside>

            <!-- Coluna da Direita: Volumes -->
            <div class="manga-detail-content">
                <div class="filter-controls-container">
                    <h2>Volumes</h2>
                    <div class="filter-controls">
                        <button class="filter-btn" data-filter="all">Todos os Volumes</button>
                        <button class="filter-btn" data-filter="Adquirido">Adquiridos</button>
                        <button class="filter-btn" data-filter="Faltando">Faltantes</button>
                    </div>
                </div>
                <div id="volumes-container" class="card-grid">
                    <!-- Volumes do mangá serão inseridos aqui -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/theme.js"></script>
    <script type="module" src="js/volumes.js"></script>
</body>
</html>
