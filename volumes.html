<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Carregando...</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">

    <div class="wallpaper-bg" id="manga-wallpaper-bg"></div>

    <header class="manga-header">
        <div class="header-content">
            <a href="index.html" class="back-button" aria-label="Voltar para a coleção">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18L9 12l6-6"/></svg>
            </a>
            <div class="filter-controls">
                <button class="filter-button active" data-filter="all">Todos</button>
                <button class="filter-button" data-filter="Adquirido">Adquiridos</button>
                <button class="filter-button" data-filter="Falta">Faltantes</button>
            </div>
            <button class="theme-button" aria-label="Mudar tema">
                <div class="theme-icon"></div>
            </button>
        </div>
    </header>

    <main class="manga-detail-main">
        <div class="manga-info">
            <h1 id="manga-title">Carregando...</h1>
            <p id="manga-synopsis">Carregando...</p>
        </div>

        <div id="volumes-container" class="card-grid">
            <!-- Volumes do mangá serão inseridos aqui -->
        </div>
    </main>

    <script src="theme.js"></script>
    <script type="module" src="volumes.js"></script>
</body>
</html>
