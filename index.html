<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Coleção de Mangás</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">

    <div class="wallpaper-bg" id="main-wallpaper"></div>

    <header>
        <div class="header-content">
            <h1>Minha Coleção</h1>
            <button class="theme-button" aria-label="Mudar tema">
                <div class="theme-icon"></div>
            </button>
        </div>
    </header>

    <main>
        <div class="manga-detail-container">
            <aside class="manga-detail-sidebar" id="collection-sidebar">
                <div class="sidebar-content">
                    <div class="manga-info">
                        <h2 id="manga-title">Estatísticas</h2>
                        <div id="collection-stats">
                            <!-- As estatísticas serão inseridas aqui -->
                        </div>
                    </div>
                </div>
            </aside>
            <div class="manga-detail-content">
                <div class="filter-controls-container">
                    <input type="text" id="search-bar" placeholder="Buscar por título...">
                </div>
                <div id="manga-grid" class="card-grid">
                    <!-- Cards dos mangás serão inseridos aqui -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/theme.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
