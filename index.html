<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Mangá Collection</title>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>My Mangá Collection</h1>
            <div class="controls">
                <div class="filter-options">
                    <button class="filter-button active" data-filter="all">All</button>
                    <button class="filter-button" data-filter="Adquirido">Acquired</button>
                    <button class="filter-button" data-filter="Falta">Missing</button>
                </div>
                <input type="text" id="search-bar" placeholder="Search by title...">
                <button id="theme-toggle" class="theme-button">
                    <span class="theme-icon"></span>
                </button>
            </div>
        </div>
    </header>
    <main>
        <div class="card-grid">
            <!-- Cards will be dynamically added here by JavaScript -->
        </div>
    </main>
    <script defer type="module" src="main.js"></script>
    <script defer src="theme.js"></script>
</body>
</html>
